<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
       <div id="project">
            <img  id="cal_icon" 
            src="images/calender.svg" alt="" >
            <h2>
                <span id="white_text">Event</span>
                <span id="purple_text">Feedback</span>
            </h2>
       </div>

       <div id="main">
            <a href="#" id="home_a">Home</a>
            <a href="#" id="event_a">Events</a>
            <a href="#" id="feedback_a">Feedback</a>
            <a href="#" id="review_a">Reviews</a>
            
       </div>
       <div class="btns" id="getstarted">
        <button>Get started</button>
       </div>
    </header>

    <section id="hero">
        <div id="left">
            <h1>
                <span id="white_text">Event Feedback</span>
                <br>
                <span id="purple_text">Management System</span>
            </h1>

            <p>collect,manage and analyze feedback for events seamlessly .Help organizers improve and create better experiences.</p>
            <div class="btns">
                <button class="btns" id="exploreevent">Explore Events</button>
                <button id="submitfeedback">Submit Feedback 
                    <img src="" alt="">
                </button>
            </div>
        </div>

        <div id="right">
             <h1 id="design">°°°</h1>

            <!-- Floating message -->
            <img id="msg_icon" src="images/massage_circle.svg" alt="">

            <!-- Floating graph -->
            <img id="graph_icon" src="images/graph.svg" alt="">

            <!-- Floating heart -->
            <img id="heart_icon" src="images/heart.svg" alt="">

            <!-- Main card -->
            <section id="card">

                <h2>Event Feedback</h2>

                <div id="rating">
                    ⭐⭐⭐⭐☆
                </div>

                <div id="bottom_section">
                    <img id="pie_chart" src="images/pi_chart.svg" alt="">
                    <div id="user_section">

                        <img id="user_profile" src="images/userprofile.svg" alt="">

                        
                        <div id="user_details">
                            <div class="line short"></div>
                            <div class="line short"></div>
                            <div class="line long"></div>
                            <div class="line long"></div>
                            <div class="line long"></div>
                        </div>

                    </div>
                </div>
            </section>

            <section id="rings">
                <div class="ring ring1"></div>
                <div class="ring ring2"></div>
                <div class="ring ring3"></div>
            </section>

        </div>
    </section>   
    <script src="home.js"></script>
</body>
</html>
